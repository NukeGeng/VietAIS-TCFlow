name: Quality gates

on:
  pull_request:
    branches:
      - main
      - frontend
      - backend
      - mobile
      - ai
  push:
    branches:
      - main
      - frontend
      - backend
      - mobile
      - ai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  analyzers:
    name: Analyzer build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore analyzers
        run: dotnet restore src/analyzers/VietAIS.TCFlow.Analyzers.sln

      - name: Build analyzers
        run: dotnet build src/analyzers/VietAIS.TCFlow.Analyzers.sln --configuration Release --no-restore

      - name: Test analyzers
        run: >-
          dotnet test src/analyzers/VietAIS.TCFlow.Analyzers.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore backend
        run: dotnet restore src/VietAIS.TCFlow.sln

      - name: Build backend
        run: dotnet build src/VietAIS.TCFlow.sln --configuration Release --no-restore

      - name: Test backend
        run: >-
          dotnet test src/VietAIS.TCFlow.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

  backend-vnext:
    name: GOAL2 vNext .NET 10 baseline and Projects slice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/vnext
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore vNext baseline
        run: dotnet restore FSH.Starter.slnx

      - name: Build vNext baseline
        run: dotnet build FSH.Starter.slnx --configuration Release --no-restore

      - name: Test vNext baseline
        run: >-
          dotnet test FSH.Starter.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

  frontend:
    name: Frontend typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/apps/vue
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/apps/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm run test:unit -- --run

      - name: Lint without rewriting source
        run: |
          npm exec -- oxlint . --deny-warnings
          npm exec -- eslint . --max-warnings=0

      - name: Check formatting
        run: npm exec -- prettier --check .

      - name: Build
        run: npm run build-only

  self-host:
    name: Self-host bundle config and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/docker-compose.yml config --quiet

      - name: Build self-host images
        run: docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/docker-compose.yml build

      - name: Validate Nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 --add-host vnext-api:127.0.0.1 vietais-tcflow/frontend:2.0.4-rc nginx -t

      - name: Smoke test self-host stack
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_KEY: ci-jwt-key-with-at-least-32-characters
          HANGFIRE_PASSWORD: ci-hangfire-password
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-password
          TCFLOW_HTTP_PORT: 18080
        run: |
          set -euo pipefail
          compose=(docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/docker-compose.yml)
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans
          }
          trap cleanup EXIT

          if ! "${compose[@]}" up -d; then
            "${compose[@]}" ps
            "${compose[@]}" logs api
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://localhost:${TCFLOW_HTTP_PORT}/health" >/dev/null; then
              break
            fi
            if [[ "${attempt}" -eq 60 ]]; then
              "${compose[@]}" ps
              "${compose[@]}" logs api frontend
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent "http://localhost:${TCFLOW_HTTP_PORT}/health" >/dev/null
          curl --fail --silent "http://localhost:${TCFLOW_HTTP_PORT}/alive" >/dev/null
          curl --fail --silent "http://localhost:${TCFLOW_HTTP_PORT}/" | grep -qi "<html"
          api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:${TCFLOW_HTTP_PORT}/api/v1/projects")"
          [[ "${api_status}" == "401" ]]
