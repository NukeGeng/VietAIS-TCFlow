services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietais_tcflow}
      POSTGRES_USER: ${POSTGRES_USER:-tcflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # GOAL2 canary resources. The default compose profile remains the v0.1
  # rollback bundle; enable --profile goal2 only after migration evidence is
  # accepted for the target environment.
  rabbitmq:
    profiles: ["goal2"]
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tcflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for the GOAL2 profile}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  vnext-api:
    profiles: ["goal2"]
    image: ${TCFLOW_IMAGE_PREFIX:-vietais-tcflow}/vnext-api:${TCFLOW_VERSION:-2.0.4-rc}
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile.vnext
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__marten: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vietais_tcflow};Username=${POSTGRES_USER:-tcflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DatabaseOptions__Provider: postgresql
      DatabaseOptions__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vietais_tcflow};Username=${POSTGRES_USER:-tcflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DatabaseOptions__MigrationsAssembly: FSH.Starter.Migrations.PostgreSQL
      EventingOptions__Provider: RabbitMQ
      EventingOptions__RabbitMQ__Host: rabbitmq
      EventingOptions__RabbitMQ__Port: 5672
      EventingOptions__RabbitMQ__UserName: ${RABBITMQ_USER:-tcflow}
      EventingOptions__RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for the GOAL2 profile}
      EventingOptions__RabbitMQ__ExchangeName: ${RABBITMQ_EXCHANGE:-tcflow.integration.events}
      JwtOptions__Issuer: tcflow.self-host
      JwtOptions__Audience: tcflow.clients
      JwtOptions__SigningKey: ${JWT_KEY:?JWT_KEY must be set in .env}
      HangfireOptions__UserName: ${HANGFIRE_USERNAME:-admin}
      HangfireOptions__Password: ${HANGFIRE_PASSWORD:?HANGFIRE_PASSWORD must be set in .env}
      MailOptions__UseSendGrid: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  api:
    image: ${TCFLOW_IMAGE_PREFIX:-vietais-tcflow}/api:${TCFLOW_VERSION:-2.0.4-rc}
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile.api
    volumes:
      - api-images:/app/assets/images
      - api-files:/app/assets/others
      - reasoning-data:/app/.tcflow/codex-reasoning
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vietais_tcflow};Username=${POSTGRES_USER:-tcflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      ConnectionStrings__redis: redis:6379
      DatabaseOptions__Provider: postgresql
      OriginOptions__OriginUrl: ${TCFLOW_PUBLIC_URL:-http://localhost:8080}
      CorsOptions__AllowedOrigins__0: ${TCFLOW_PUBLIC_URL:-http://localhost:8080}
      JwtOptions__Key: ${JWT_KEY:?JWT_KEY must be set in .env}
      HangfireOptions__Username: ${HANGFIRE_USERNAME:-admin}
      HangfireOptions__Password: ${HANGFIRE_PASSWORD:?HANGFIRE_PASSWORD must be set in .env}
      HangfireOptions__Route: ${HANGFIRE_ROUTE:-/jobs}
      BootstrapAdminOptions__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set in .env}
      GitHub__AppId: ${GITHUB_APP_ID:-0}
      GitHub__AppSlug: ${GITHUB_APP_SLUG:-}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      GitHub__PrivateKeyBase64: ${GITHUB_PRIVATE_KEY_BASE64:-}
      GitHub__OAuthCallbackUrl: ${GITHUB_OAUTH_CALLBACK_URL:-http://localhost:8080/github/callback}
      GitHub__WebhookSecret: ${GITHUB_WEBHOOK_SECRET:-}
      RepositoryReasoning__Enabled: ${REPOSITORY_REASONING_ENABLED:-false}
      RepositoryReasoning__ExecutablePath: ${REPOSITORY_REASONING_EXECUTABLE:-codex}
      RepositoryReasoning__WorkingDirectory: ${REPOSITORY_REASONING_WORKING_DIRECTORY:-.tcflow/codex-reasoning}
      RepositoryReasoning__Model: ${REPOSITORY_REASONING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    image: ${TCFLOW_IMAGE_PREFIX:-vietais-tcflow}/frontend:${TCFLOW_VERSION:-2.0.4-rc}
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile.frontend
    ports:
      - ${TCFLOW_HTTP_PORT:-8080}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  api-images:
  api-files:
  postgres-data:
  reasoning-data:
  redis-data:
  rabbitmq-data:
