server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;
    # Resolve the optional GOAL2 service at request time. The default profile
    # intentionally does not create vnext-api, so startup must not require
    # that DNS record to exist.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GOAL2 canary API is enabled with the compose goal2 profile. The more
    # specific prefix keeps vNext traffic isolated from the v0.1 API.
    location /api/vnext/ {
        set $vnext_api_upstream http://vnext-api:8081;
        proxy_pass $vnext_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/vnext/health {
        set $vnext_health_upstream http://vnext-api:8081/health;
        proxy_pass $vnext_health_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /alive {
        proxy_pass http://api:8080/alive;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
